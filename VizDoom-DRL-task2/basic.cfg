# Basic ViZDoom configuration file
# This is a simplified version of the basic scenario

# Game settings
doom_skill 3
doom_scenario_path "basic.wad"
doom_map 1

# Screen settings
screen_resolution RES_640X480
screen_format RGB24
screen_depth 24

# Game variables
available_buttons MOVE_LEFT MOVE_RIGHT ATTACK
available_game_variables HEALTH AMMO2
episode_timeout 2100
episode_start_time 14
living_reward -1
death_penalty 1

# Rewards
kill_reward 100
ammo_penalty 0.1
health_penalty 0.1

# Rendering
render_crosshair false
render_weapon true
render_decals false
render_particles false
render_effects_sprites false
render_messages false
render_corpses false
render_screen_flashes true

# Sound
sound_enabled false 